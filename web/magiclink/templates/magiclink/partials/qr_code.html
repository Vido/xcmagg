<div class="qr-code-display" data-ttl="{{ ttl }}">
    <h2 class="text-md text-gray-600 dark:text-gray-400 mb-3">Scan to Upload from Mobile</h2>
    {% load qr_code %}
    {% qr_from_text magic_url size="M" %}
    <p class="text-xs text-gray-500 mt-3">Valid for {{ ttl }} seconds. Created at {{ created_at|date:"H:i:s" }}</p>
    
    <details>
        <summary>Or copy the code manually:</summary>
        <input type="text" value="{{ magic_url }}" readonly
        class="mt-2 w-full rounded-md px-3 py-2 text-sm
               bg-gray-50 dark:bg-gray-900
               border border-gray-300 dark:border-gray-700
               text-gray-800 dark:text-gray-100
               focus:outline-none focus:ring-1 focus:ring-gray-400 dark:focus:ring-gray-600"
        >
    </details>
    
</div>
