<!-- Comments Section -->
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100 mb-6 flex items-center">
      <svg class="w-6 h-6 mr-2 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      Comments
      <span class="ml-2 px-2.5 py-0.5 rounded-full text-sm font-medium bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
        {{ TODO.count }}
      </span>
    </h2>

    {% include 'engagement/includes/_comment_form.html' %}

    <!-- Comments List -->
    <div id="comments-list" class="space-y-6" aria-live="polite">
      {% for subnode in node.comments %}
        {% include "engagement/partials/_single_comment.html" with comment=subnode.post %}
      {% empty %}
        <div class="text-center py-8">
          <svg class="w-16 h-16 text-gray-300 dark:text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <p class="text-gray-500 dark:text-gray-400">No comments yet. Be the first to comment!</p>
        </div>
      {% endfor %}
    </div>
  </div>

  <script>
    // Additional handling for form reset on successful submission
    document.addEventListener('htmx:afterRequest', function(event) {
      if (event.detail.target.id === 'comments-list' && event.detail.successful) {
        const form = document.getElementById('comment-form');
        const textarea = document.getElementById('comment-textarea');
        const actions = document.getElementById('comment-actions');
        
        if (form && textarea && actions) {
          form.reset();
          textarea.blur();
          actions.classList.add('hidden');
        }
      }
    });
  </script>
