<div class="flex items-center justify-between w-full">

  <!-- LEFT: comments / share -->
  <div class="flex items-center gap-4">
    <!-- Comments -->
    <button class="flex items-center gap-1 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
      </svg>
      <span>{{ node.comment_count|default:'?' }}</span>
    </button>

    <!-- Share -->
    <button class="flex items-center gap-1 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
      <svg xmlns="http://www.w3.org/2000/svg"
           fill="none"
           viewBox="0 0 24 24"
           stroke-width="1.5"
           stroke="currentColor"
           class="w-5 h-5">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
      </svg>
      <span>Share</span>
    </button>
  </div>

  <!-- RIGHT: reply / edit / delete -->
  <div class="flex items-center gap-4">
    {% if node.kind == 'comment' %}
    <button class="flex items-center gap-1 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
      <svg xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24"
           fill="currentColor"
           class="w-5 h-5">
        <path fill-rule="evenodd"
              d="M9.53 3.97a.75.75 0 0 1 0 1.06L6.56 8h8.69a6.75 6.75 0 1 1 0 13.5h-1.5a.75.75 0 0 1 0-1.5h1.5a5.25 5.25 0 1 0 0-10.5H6.56l2.97 2.97a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
              clip-rule="evenodd" />
      </svg>
      <span>Reply</span>
    </button>
    {% endif %}

    {% if request.user == node.owner %}
    <a href="{% url 'edit-post' node.shortcode %}"
       class="flex items-center gap-1 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
      Edit
    </a>
      {% comment %}
      <button
      class="flex items-center gap-1 text-red-600 hover:text-red-700 transition "
        hx-delete="{% url 'edit-post' node.shortcode %}"
        hx-confirm="Are you Sure?"
      >
        Delete
      </button>
      {% endcomment %}

    {% endif %}
  </div>
</div>
