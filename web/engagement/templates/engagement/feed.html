{% extends "base.html" %}
{% load static %}

{% block title %}Feed{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-2 sm:px-4 grid md:grid-cols-3 gap-4 sm:gap-8">

  <!-- Main Feed Column -->
  <div class="md:col-span-2 space-y-4">
    
    <!-- Sort/Filter Bar -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow px-2 sm:px-4 py-2 sm:py-3 flex items-center space-x-1 sm:space-x-4">
      <button 
        class="flex items-center space-x-2 px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition"
        hx-get="{% url 'feed' %}?sort=hot"
        hx-target="#feed-container"
        hx-swap="innerHTML"
        hx-push-url="true">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"/>
        </svg>
        <span class="font-medium text-gray-700 dark:text-gray-200">Hot</span>
      </button>
      
      <button 
        class="flex items-center space-x-2 px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition"
        hx-get="{% url 'feed' %}?sort=new"
        hx-target="#feed-container"
        hx-swap="innerHTML"
        hx-push-url="true">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
        </svg>
        <span class="font-medium text-gray-700 dark:text-gray-200">New</span>
      </button>
      
      <button 
        class="flex items-center space-x-2 px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition"
        hx-get="{% url 'feed' %}?sort=top"
        hx-target="#feed-container"
        hx-swap="innerHTML"
        hx-push-url="true">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
        </svg>
        <span class="font-medium text-gray-700 dark:text-gray-200">Top</span>
      </button>

      <div class="flex-1"></div>

      <!-- View Toggle -->
      <div class="flex items-center space-x-2">
        <button class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Feed Container -->
    <div id="feed-container" class="space-y-4">
      {% include 'engagement/partials/_post_list.html' with posts=posts %}
    </div>
    <div id="feed-spinner" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2">
      <svg class="animate-spin h-5 w-5 text-gray-400" viewBox="0 0 24 24"></svg>
    </div>

  </div>

  <!-- Sidebar -->
  <div class="hidden md:block space-y-4">
    {% include "engagement/includes/_sidebar.html" %}
  </div>


</div>
{% endblock %}

{% block scripts %}
<script>
  // Handle sort button active state
  document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const currentSort = urlParams.get('sort') || 'new';
    
    // Add active styling to current sort button
    document.querySelectorAll('[hx-get*="sort="]').forEach(button => {
      const buttonSort = new URL(button.getAttribute('hx-get'), window.location.origin).searchParams.get('sort');
      if (buttonSort === currentSort) {
        button.classList.add('bg-gray-100', 'dark:bg-gray-700');
      }
    });
  });
</script>
{% endblock %}
