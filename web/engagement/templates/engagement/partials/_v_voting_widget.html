{% load user_vote %}

<div class="flex flex-col items-center space-y-1" id="votes-{{ node.shortcode }}">
<!-- Upvote -->
<button
  hx-post="{% url 'cast-vote' node.shortcode %}?widget=v"
  hx-vals='{"action": "UP"}'
  hx-target="#votes-{{ node.shortcode }}"
  hx-swap="outerHTML"
  class="p-1 rounded hover:bg-orange-100 dark:hover:bg-orange-900/30 transition
	 {% if node|user_vote:user == 'UP' %}text-orange-500{% else %}text-gray-400 dark:text-gray-500 hover:text-orange-500{% endif %}">
  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
    <path fill-rule="evenodd" d="M3.293 9.707a1 1 0 011.414 0L10 3.414l5.293 5.293a1 1 0 111.414-1.414l-6-6a1 1 0 00-1.414 0l-6 6a1 1 0 010 1.414z" clip-rule="evenodd"/>
  </svg>
</button>

<!-- Score -->
<span id="votes-{{ node.shortcode }}" 
      class="text-xs font-bold {% if node|user_vote:user == 'UP' %}text-orange-500{% elif node|user_vote:user == 'DOWN' %}text-blue-500{% else %}text-gray-700 dark:text-gray-300{% endif %}">
  {{ node.score|default:'?' }}
</span>

<!-- Downvote -->
<button
  hx-post="{% url 'cast-vote' node.shortcode %}?widget=v"
  hx-vals='{"action": "DOWN"}'
  hx-target="#votes-{{ node.shortcode }}"
  hx-swap="outerHTML"
  class="p-1 rounded hover:bg-blue-100 dark:hover:bg-blue-900/30 transition
	 {% if node|user_vote:user == 'DOWN' %}text-blue-500{% else %}text-gray-400 dark:text-gray-500 hover:text-blue-500{% endif %}">
  <svg class="w-6 h-6 transform rotate-180" fill="currentColor" viewBox="0 0 20 20">
    <path fill-rule="evenodd" d="M3.293 9.707a1 1 0 011.414 0L10 3.414l5.293 5.293a1 1 0 111.414-1.414l-6-6a1 1 0 00-1.414 0l-6 6a1 1 0 010 1.414z" clip-rule="evenodd"/>
  </svg>
</button>
</div>
