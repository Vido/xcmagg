{% if results %}
<div class="border border-gray-400 dark:border-gray-500 rounded shadow-xl overflow-hidden
            bg-white dark:bg-gray-800 ring-1 ring-black/5 dark:ring-white/10">
  {% for result in results %}
  <button type="button"
    onclick="document.getElementById('id_category').value='{{ result.pk }}';
             document.querySelector('[name=category_label]').value='{{ result.title|escapejs }}';
             document.getElementById('category-results').innerHTML='';"
    class="block w-full text-left px-4 py-2.5 text-sm font-medium
           text-gray-700 dark:text-gray-200
           border-b border-gray-200 dark:border-gray-700 last:border-b-0
           hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 dark:hover:text-white">
    {{ result.title }}
  </button>
  {% endfor %}
</div>
{% endif %}
