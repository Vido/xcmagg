{% comment %}Bonk-risk alert. `margin` sets the bottom-margin utility (default mb-4).{% endcomment %}
<div id="bonkWarning" class="rounded bg-amber-100 text-amber-800 border border-amber-200 dark:bg-amber-900/30 dark:text-amber-200 dark:border-amber-800 py-2 px-3 {{ margin|default:'mb-4' }} text-sm" style="display:none">
  ⚠️ <strong>Bonking risk</strong><span id="bonkContext"></span> — glycogen may run out around <strong><span id="bonkTime">—</span></strong>. Increase carb target, or decrease intensity.
</div>
