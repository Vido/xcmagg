{% comment %}Scoped component styles shared by the nutrition / hydration / fuel-plan pages.{% endcomment %}
<style>
  /* BS5 form-range look: full grey track + blue dot thumb (no left fill) */
  #fuelplan-app input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent; cursor: pointer;
  }
  #fuelplan-app input[type=range]::-webkit-slider-runnable-track {
    height: .25rem; border-radius: 1rem; background: #dee2e6;
  }
  #fuelplan-app input[type=range]::-moz-range-track {
    height: .25rem; border-radius: 1rem; background: #dee2e6;
  }
  #fuelplan-app input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -.375rem;
    width: 1rem; height: 1rem; border-radius: 50%; background: #0d6efd; border: 0;
  }
  #fuelplan-app input[type=range]::-moz-range-thumb {
    width: 1rem; height: 1rem; border-radius: 50%; background: #0d6efd; border: 0;
  }
  .dark #fuelplan-app input[type=range]::-webkit-slider-runnable-track { background: #3f3f46; }
  .dark #fuelplan-app input[type=range]::-moz-range-track { background: #3f3f46; }

  #fuelplan-app .raw-value { font-size: 2.8rem; font-weight: 700; line-height: 1.1; }
  #fuelplan-app .raw-unit { font-size: 1rem; color: #6c757d; }
  @media (max-width: 768px) {
    #fuelplan-app .raw-value { font-size: 1.8rem; }
    #fuelplan-app .raw-unit { font-size: .85rem; }
  }
  #fuelplan-app .plan-list { list-style: none; padding: 0; margin: 0; }
  #fuelplan-app .plan-list li { padding: 6px 0; font-size: 1.05rem; border-bottom: 1px solid #f0f0f0; }
  #fuelplan-app .plan-list li:last-child { border-bottom: none; }
  #fuelplan-app .plan-list li:has(+ .plan-totals-row) { border-bottom: none; }
  #fuelplan-app .plan-totals-row + li { padding-top: 14px; }
  #fuelplan-app .plan-item-qty { font-weight: 700; font-size: 1.2rem; }
  #fuelplan-app .stops-big { font-size: 3rem; font-weight: 700; line-height: 1; }
  #fuelplan-app .plan-section-divider { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #adb5bd; padding: 8px 0 2px; border-bottom: none !important; }
  #fuelplan-app .plan-totals-row { background: whitesmoke; margin: 6px -12px -8px; padding: 10px 12px !important; border-top: 2px solid lightgray !important; border-bottom: none !important; border-radius: 0 0 6px 6px; }
  #fuelplan-app .totals-heading { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: gray; margin-bottom: 8px; }
  #fuelplan-app .totals-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  #fuelplan-app .totals-chip { display: flex; flex-direction: column; background: white; border: 1px solid lightgray; border-radius: 6px; padding: 6px 10px; min-width: 72px; }
  #fuelplan-app .totals-chip-value { font-size: 1rem; font-weight: 700; line-height: 1.2; }
  #fuelplan-app .totals-chip-label { font-size: 0.7rem; color: gray; }
  #fuelplan-app .bottle-osm { display: flex; align-items: baseline; gap: 6px; padding-top: 10px; }
  #fuelplan-app .bottle-osm__value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  #fuelplan-app .bottle-osm__unit { font-size: 0.75rem; color: gray; }
  #fuelplan-app .bottle-osm__badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 20px; margin-left: 2px; }
  #fuelplan-app .bottle-osm__badge--hypotonic       { background: #e0f2fe; color: #0369a1; }
  #fuelplan-app .bottle-osm__badge--isotonic        { background: #dcfce7; color: #166534; }
  #fuelplan-app .bottle-osm__badge--mild-hypertonic { background: #ecfccb; color: #3f6212; }
  #fuelplan-app .bottle-osm__badge--hypertonic      { background: #fef3c7; color: #92400e; }
  #fuelplan-app .bottle-osm__badge--very-hypertonic { background: #fee2e2; color: #991b1b; }
  .dark #fuelplan-app .bottle-osm__unit { color: #a1a1aa; }
  .dark #fuelplan-app .bottle-osm__badge--hypotonic       { background: #0c4a6e; color: #7dd3fc; }
  .dark #fuelplan-app .bottle-osm__badge--isotonic        { background: #14532d; color: #86efac; }
  .dark #fuelplan-app .bottle-osm__badge--mild-hypertonic { background: #1a2e05; color: #bef264; }
  .dark #fuelplan-app .bottle-osm__badge--hypertonic      { background: #78350f; color: #fcd34d; }
  .dark #fuelplan-app .bottle-osm__badge--very-hypertonic { background: #7f1d1d; color: #fca5a5; }
  /* Nutrition results split (toggled by setMode); kept in CSS so it survives a Tailwind purge. */
  @media (min-width: 768px)  { #fuelplan-app #nutriGrid.nut-split { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { #fuelplan-app #nutriGrid.nut-split { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
  /* Dark-mode softening for the bespoke components */
.dark #fuelplan-app .plan-list li { border-bottom-color: #3f3f46; }
  .dark #fuelplan-app .plan-totals-row { background: #27272a; border-top-color: #52525b !important; }
  .dark #fuelplan-app .totals-chip { background: #18181b; border-color: #3f3f46; }
  .dark #fuelplan-app .totals-heading,
  .dark #fuelplan-app .totals-chip-label { color: #a1a1aa; }
</style>
