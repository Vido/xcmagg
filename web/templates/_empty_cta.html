{% comment %}
Empty-state CTA. Usage:
  {% include '_empty_cta.html' with cta_title="..." cta_text="..." cta_url=url cta_label="..." %}
cta_url/cta_label optional (button hidden if no url).
{% endcomment %}
<div class="text-center py-16">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-800 mb-5">
    <svg class="w-8 h-8 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
  </div>
  <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-2">{{ cta_title }}</h3>
  <p class="text-gray-600 dark:text-gray-400 mb-6 max-w-md mx-auto">{{ cta_text }}</p>
  {% if cta_url %}
    <a href="{{ cta_url }}"
       class="inline-flex items-center px-6 py-3 bg-violet-600 hover:bg-violet-700 text-white font-medium rounded-lg transition focus:ring-4 focus:ring-violet-300">
      {{ cta_label }}
    </a>
  {% endif %}
</div>
