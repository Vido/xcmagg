<div id="identity-gate" hx-on="htmx:afterSwap: this.scrollIntoView({behavior:'smooth'})">
    <div x-data="{ emailSent: {{ yeet|default:False|yesno:'true,false' }} }">
        <form 
            x-show="!emailSent"
            hx-post="{% url 'identity_gate' %}" 
            hx-target="#identity-gate"
            hx-swap="outerHTML"
            class="space-y-4">
            
            {% csrf_token %}
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Email address
                </label>
                <input 
                    type="email" 
                    name="email" 
                    id="email" 
                    required
                    class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="you@example.com">
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400">
                This creates an account if you don’t have one yet.
            </p>
            
            {% load turnstile %}
            <div id="cf-turnstile-container" class="flex justify-center">
                {% turnstile %}
            </div>

            {% if form_error %}
            <div class="rounded-md bg-red-50 dark:bg-red-900/20 p-4 border border-red-200 dark:border-red-800"
              role="alert" aria-live="assertive">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700 dark:text-red-300">
                            {{ form_error }}
                        </p>
                    </div>
                </div>
            </div>
            {% endif %}

            <button 
                type="submit"
                hx-disabled-elt
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-white bg-green-700 hover:bg-green-800 dark:bg-green-700 dark:hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-600 transition font-medium">
                <span class="htmx-hide-on-request">Send Verification Link</span>
                <span class="htmx-show-on-request">Yeeting…</span>
            </button>
        </form>

        <!-- Email sent confirmation (Alpine.js) -->
        <div x-show="emailSent" 
             x-cloak role="status" aria-live="polite"
             class="mt-4 rounded-md bg-green-50 dark:bg-green-900/20 p-4 border border-green-200 dark:border-green-800">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-green-800 dark:text-green-300">
                        Check your email! Click the link to continue — it’s valid for a few minutes.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
